name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate examples
        run: |
          python -m llm_workflow_engine.cli validate examples/daily-brief.workflow.json
          python -m llm_workflow_engine.cli validate examples/issue-triage.workflow.json
          python -m llm_workflow_engine.cli validate examples/release-notes.workflow.json
      - name: Dry-run examples
        run: |
          python -m llm_workflow_engine.cli run examples/daily-brief.workflow.json
          python -m llm_workflow_engine.cli run examples/issue-triage.workflow.json
          python -m llm_workflow_engine.cli run examples/release-notes.workflow.json
